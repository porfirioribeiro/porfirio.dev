name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'
      - run: pnpm install

      - name: Build
        run: pnpm exec vp build

      - name: Check for a Workers deploy token
        id: token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          LEGACY_CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
          ACCOUNT_ID: 0bf87e76fffe7554f4cbc045738e5dd5
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "token=$CLOUDFLARE_API_TOKEN" >> "$GITHUB_OUTPUT"
            echo "Deploy token: CLOUDFLARE_API_TOKEN" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Fall back to the legacy cache-purge token if it can also edit Workers
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $LEGACY_CLOUDFLARE_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/scripts/porfirio-dev")
          if [ "$code" = "200" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "token=$LEGACY_CLOUDFLARE_TOKEN" >> "$GITHUB_OUTPUT"
            echo "Deploy token: legacy CLOUDFLARE_TOKEN (probe $code)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Workers-capable token (CLOUDFLARE_API_TOKEN unset, legacy CLOUDFLARE_TOKEN probe: $code); skipping deploy. Add an API token with Workers Scripts:Edit."
          fi

      - name: Deploy to Cloudflare Workers
        if: steps.token.outputs.present == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ steps.token.outputs.token }}
          command: deploy
